unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# New panes run a plain interactive shell, like a terminal window does, so
# bash reads ~/.bashrc. tmux's default is a login shell, which reads
# /etc/profile and ~/.bash_profile instead and only gets ~/.bashrc if those
# source it, so a system-wide prompt can win. The environment (PATH etc.)
# still comes from the shell tmux was started from.
set -g default-command "${SHELL}"

bind v split-window -hc "#{pane_current_path}"
bind s split-window -vc "#{pane_current_path}"

# vim key bindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe
# Copies (y, Enter, mouse drag) also go to the system clipboard
set -s copy-command 'xclip -selection clipboard'

set -g mouse on

# Programs inside tmux get a 256-colour TERM. tmux 3.5+ defaults to
# tmux-256color; older versions use plain screen, which drops colours (the
# bash prompt from ~/.bashrc among them). screen-256color where tmux-256color's
# terminfo isn't installed (ncurses-term).
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
    "set -g default-terminal tmux-256color" \
    "set -g default-terminal screen-256color"

# Outer terminal supports 24-bit colour; without this tmux rounds delta's
# backgrounds to the 256-colour palette (added lines come out black)
set -as terminal-features ',xterm-256color:RGB'

bind = select-layout even-horizontal
bind - select-layout even-vertical

# Alt-hjkl moves between panes. If the pane is running nvim, pass the key
# through instead; nvim's config/navigation.lua hands it back at the edge.
is_nvim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -qE '^[^TXZ ]+ +(\\S+\\/)?nvim$'"
bind -n M-h if-shell "$is_nvim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_nvim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_nvim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_nvim" "send-keys M-l" "select-pane -R"
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Alt+Shift+hjkl resizes the current pane
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Number windows and panes from 1 so they match the keyboard, and close
# gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the current directory instead of the running program,
# with ~ for the home directory. A window renamed by hand (prefix ,) keeps its name.
setw -g automatic-rename-format "#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"

# Alt+1..9 jumps straight to a window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

set -g history-limit 50000
# How long to wait after Esc for a following key before treating it as plain
# Esc. Kept short so Esc then j in nvim isn't read as Alt+j (pane switch), but
# not 0, which can split Alt keys sent over a slow link (ssh) into Esc + key.
# Matches nvim's ttimeoutlen (options.lua). 10ms is the tmux 3.5 default; set
# explicitly for older versions.
set -s escape-time 10
# Pass focus changes to programs so nvim can reload files changed elsewhere
set -g focus-events on

# Session persistence (tmux-resurrect + tmux-continuum, installed into
# ~/.tmux/plugins by dotfiles-bootstrap): sessions, windows, pane layouts and
# working directories are saved every 15 minutes and restored when the tmux
# server starts, e.g. after a reboot. prefix Ctrl-s saves now, prefix Ctrl-r
# restores. Programs like nvim, less and man are restarted with their arguments.
# Kept last: continuum hooks its autosave into status-right.
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
if-shell "test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
    "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux" \
    "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"
